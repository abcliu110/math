<div id="top">
  <button class="menu-btn" id="burger" title="实验库 / 步骤" aria-label="实验库和步骤">≡</button>
  <span class="brand">数学小宇宙</span>
  <span class="ptitle" id="ptitle"></span>
  <div class="seg" id="modes"><button data-mode="free">自由探究</button><button data-mode="practice">练习</button><button data-mode="exam">考试</button></div>
  <div class="dd"><button class="tbtn" id="menubtn">菜单</button>
    <div class="ddm" id="menu"><button id="themebtn" title="深色 / 浅色；默认跟随系统">外观：跟随系统</button><button id="contrastbtn" aria-pressed="false" title="颜色对比度更高（两套主题的文字都 ≥ 4.5:1）">高对比度：关</button><button id="animbtn" aria-pressed="true" title="步骤之间的过渡动画（约 0.2 秒）；关掉后步骤立刻换">动画：开</button><button id="youngbtn" aria-pressed="false" title="字体和按钮更大，工作区只留最常用的工具">低年级模式：关</button><button data-m="save">保存台面到文件</button><button data-m="load">从文件载入台面</button><button data-m="share">分享台面…</button><button data-m="author">出一道凑数题…</button><button data-m="student">我来出题…</button><button data-m="board">班级看板…</button><button data-m="myexport">导出我的题</button><button data-m="myimport">导入题目</button><button data-m="wrong">错题本</button><button data-m="report">学习报告</button><button data-m="parent">家长周报</button><button data-m="improve">改进清单</button><button data-m="health">知识点体检表</button><button data-m="guide">几何工作区引导</button><button data-m="export">导出学习记录</button><button data-m="clearlog">清除学习记录</button></div></div>
  <span class="sp"></span>
  <button class="tbtn pri" id="submit" style="display:none">交卷</button>
  <button class="tbtn" id="undo">撤销</button><button class="tbtn" id="redo">重做</button>
  <button class="tbtn hm" id="tidy">整理</button><button class="tbtn hm" id="clear">清空台面</button>
  <button class="tbtn hm" id="shelfbtn" style="display:none">器材</button>
</div>
<div id="main">
  <div id="left">
    <button class="railbtn" id="lrail" title="收起实验库" aria-label="收起实验库">‹</button>
    <div class="tabs" id="ltabs"><button data-tab="lab">实验库</button><button data-tab="steps">步骤</button></div>
    <div class="scroll" id="leftbody"></div>
  </div>
  <div id="stagewrap">
    <div id="stage"><div id="world"></div></div>
    <div id="banner" style="display:none"></div>
    <div id="guide" class="guide" style="display:none"></div>
    <div id="insp"></div>
    <div class="fab" id="zoom"><button id="zout" aria-label="缩小台面">−</button><span class="zv" id="zv">100%</span><button id="zin" aria-label="放大台面">+</button><button id="zfit">适应</button></div>
    <div class="fab" id="clockbar">
      <button id="rew" title="回到第 0 拍" aria-label="回到第 0 拍">⏮</button><button id="go" class="go" title="开始 / 暂停（空格）" aria-label="开始或暂停">▶</button><button id="step1" title="走一拍" aria-label="走一拍">⏭</button>
      <span class="tk" id="tk"></span>
      <span class="rate"><button data-rate="0.5">0.5×</button><button data-rate="1">1×</button><button data-rate="4">4×</button><button data-rate="20">20×</button></span>
    </div>
    <div class="fab" id="fabr"><button id="why">💡 为什么</button><button id="found">📝 我的发现</button></div>
  </div>
  <div id="right">
    <button class="railbtn" id="rrail" title="收起器材架" aria-label="收起器材架">›</button>
    <div class="sh" style="padding:12px;border-bottom:1px solid var(--line)"><input class="search" id="q2" placeholder="搜索器材"></div>
    <div class="scroll" id="shelfbody"></div>
  </div>
</div>
