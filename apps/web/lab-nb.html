<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>数学实验室 · 工作台</title>
<style>
:root{--bar:#121822;--panel:#18202c;--panel2:#202a38;--line:#2c3848;--stage:#1b2431;--grid:#232e3d;--tx:#e6ecf3;--mut:#8a98ab;--acc:#3b9cff;--ok:#2fbf71;--warn:#f0a63a;--err:#ff5b5b;--card:#f6f8fb;--ink:#1d2633}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bar);color:var(--tx);font:14px/1.45 "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:auto 1fr 248px;height:100%}
/* 顶栏 */
#top{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line)}
#top .logo{font-weight:700;letter-spacing:.5px;margin-right:6px}
#title{min-width:120px;max-width:340px;padding:4px 8px;border-radius:6px;outline:0;white-space:nowrap;overflow:hidden}
#title:hover,#title:focus{background:var(--panel2)}
.seg{display:flex;background:var(--panel2);border-radius:8px;padding:3px}
.seg button{padding:5px 12px;border-radius:6px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.tb{padding:6px 10px;border-radius:7px;color:var(--mut)}.tb:hover{background:var(--panel2);color:var(--tx)}
.tb[disabled]{opacity:.35;pointer-events:none}
.sp{flex:1}
#timer{font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:7px;background:#2a1f1f;color:#ffb4b4;display:none}
#submit{display:none;background:var(--err);color:#fff;padding:6px 14px;border-radius:7px;font-weight:600}
#menuBtn{display:none}
/* 左栏 */
#left{grid-row:2;width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:width .2s}
#left.closed{width:0;overflow:hidden;border:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 0;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-color:var(--acc)}
.pane{flex:1;overflow:auto;padding:12px;min-height:0}
.search{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);outline:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--mut);font-size:12px}
.chip.on{background:#1f3b5c;color:#cfe6ff}
.xp{padding:10px 12px;border-radius:10px;background:var(--panel2);margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.xp:hover{border-color:var(--line)}.xp.on{border-color:var(--acc)}
.xp b{display:block;margin-bottom:3px}.xp small{color:var(--mut)}
.detail{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);color:var(--mut);font-size:13px}
.detail .row{display:flex;gap:8px;margin-top:8px}
.btn{padding:7px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--tx)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.red{background:var(--err);border-color:var(--err);color:#fff}
.step{display:flex;gap:10px;padding:10px;border-radius:10px;margin-bottom:8px;background:var(--panel2);border:1px solid transparent}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px}
.step.done .n{background:var(--ok);color:#fff}.step.cur{border-color:var(--acc)}
.step.cur .n{background:var(--acc);color:#fff}
.step .hint{color:#9fd0ff;font-size:12px;margin-top:4px}
.step .sc{margin-left:auto;color:var(--mut);font-size:12px;flex:none}
.muted{color:var(--mut)}
.q{padding:10px 12px;border-radius:10px;background:#1f3047;margin-bottom:12px}
/* 舞台 */
#stageWrap{grid-row:2;position:relative;overflow:hidden;background:var(--stage)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage.panning{cursor:grabbing}
.ent-body{fill:var(--card);stroke:#c9d3df;stroke-width:1}
.ent.sel .ent-body{stroke:#9aa9bb}
.ent.err .ent-body{stroke:var(--err);stroke-width:2}
.ent.ok .ent-body{stroke:var(--ok);stroke-width:2}
.ent.is-next .ent-body{stroke:var(--acc);stroke-width:3;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.35}}
.selbox{fill:none;stroke:#cfd8e3;stroke-dasharray:5 4;stroke-width:1.5;pointer-events:none}
.ttl{fill:#6b7889;font-size:12px}
.big{fill:var(--ink);font-weight:700}
.ink{fill:var(--ink)}
.port-out{fill:var(--acc);stroke:#fff;stroke-width:2;cursor:crosshair}
.port-out:hover{r:9}
.port-in{fill:#fff;stroke:#9aa9bb;stroke-width:2;pointer-events:none}
.link{fill:none;stroke:#7fc1ff;stroke-width:2.5;stroke-dasharray:7 6;animation:flow 0.9s linear infinite;pointer-events:none}
.link.sel{stroke:#ffd166;stroke-width:3.5}
.linkhit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.templink{fill:none;stroke:#ffd166;stroke-width:2;stroke-dasharray:4 4;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-13}}
.flowline{stroke-dasharray:8 6;animation:flow 0.9s linear infinite}
.seg-cell{cursor:pointer}
.pill rect{rx:10}
.pill text{font-size:12px}
/* 浮动 */
#tools{position:absolute;display:none;flex-direction:column;gap:2px;background:#0f141c;border-radius:8px;padding:4px;box-shadow:0 6px 18px #0008}
#tools button{width:32px;height:32px;border-radius:6px;font-size:15px}
#tools button:hover{background:var(--panel2)}
#card{position:absolute;display:none;width:250px;background:#0f141cf2;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 10px 28px #000a}
#card h4{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:500}
#card .state{font-size:20px;font-weight:700;margin-bottom:8px}
.fld{margin:8px 0}.fld label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.fld .ctl{display:flex;align-items:center;gap:6px;margin-top:4px}
.fld input[type=range]{flex:1;accent-color:var(--acc)}
.fld input[type=number],#card .name{width:58px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);outline:0}
#card .name{width:100%;margin-bottom:6px}
.pm{width:26px;height:26px;border-radius:6px;background:var(--panel2)}
.card-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card-row .btn{padding:5px 9px;font-size:12px}
#zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:2px;background:#0f141cd9;border-radius:9px;padding:3px;align-items:center}
#zoom button{min-width:30px;padding:0 6px;height:28px;border-radius:6px}#zoom button:hover{background:var(--panel2)}
#zoom span{min-width:46px;text-align:center;font-size:12px;color:var(--mut)}
#corner{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
#corner .btn{background:#0f141cd9}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:8px 14px;border-radius:9px;background:#0f141cf0;border:1px solid var(--line);display:none;max-width:70%}
#toast.err{border-color:var(--err);color:#ffc2c2}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#5d6b7e;text-align:center}
/* 器材架 */
#lib{grid-row:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#lib .hd{padding:12px;border-bottom:1px solid var(--line)}
#lib .body{flex:1;overflow:auto;padding:10px 12px}
.grp{font-size:12px;color:var(--mut);margin:10px 0 6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel2);border-radius:10px;padding:8px 6px;text-align:center;cursor:grab;border:1px solid transparent;touch-action:none}
.tile:hover{border-color:var(--acc)}
.tile svg{display:block;margin:0 auto 4px}
.tile span{font-size:12px}
#ghost{position:fixed;pointer-events:none;display:none;padding:6px 10px;border-radius:8px;background:var(--acc);color:#fff;font-size:12px;z-index:9}
/* 弹窗 */
#modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:10}
#modal .box{width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
#modal h3{margin:0 0 10px}
.score{font-size:40px;font-weight:800}
.rep{margin:10px 0;padding:0;list-style:none}.rep li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.rep .lost{color:#ffb4b4}
textarea{width:100%;min-height:90px;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
@media (max-width:900px){#app{grid-template-columns:auto 1fr 0}#lib{display:none}#left{width:260px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="tb" id="toggleLeft" title="实验库/步骤">≡</button>
    <span class="logo">数学实验室</span>
    <div id="title" contenteditable="true" spellcheck="false">我的实验</div>
    <div class="seg" id="modeSeg">
      <button data-mode="free" class="on">自由探究</button>
      <button data-mode="practice">练习</button>
      <button data-mode="exam">考试</button>
    </div>
    <button class="tb" id="menuBtn">菜单</button>
    <span class="sp"></span>
    <button class="tb" id="undo" title="撤销 Ctrl+Z">撤销</button>
    <button class="tb" id="redo" title="重做 Ctrl+Y">重做</button>
    <button class="tb" id="tidy" title="一键整理">整理</button>
    <button class="tb" id="clear">清空台面</button>
    <span id="timer">10:00</span>
    <button id="submit">提交</button>
  </header>

  <aside id="left">
    <div class="tabs"><button data-tab="lib" class="on">实验库</button><button data-tab="steps">步骤</button></div>
    <div class="pane" id="paneLib"></div>
    <div class="pane" id="paneSteps" style="display:none"></div>
  </aside>

  <main id="stageWrap">
    <svg id="stage"><defs>
      <pattern id="gridS" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#212b39" stroke-width="1"/></pattern>
      <pattern id="gridL" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gridS)"/><path d="M100 0H0V100" fill="none" stroke="#283446" stroke-width="1"/></pattern>
      <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
    </defs><rect id="bg" width="100%" height="100%" fill="url(#gridL)"/><g id="world"></g></svg>
    <div id="empty"><div><div style="font-size:18px;margin-bottom:6px">台面是空的</div>从右边器材架拖一个器材上来，或在左边选一个实验</div></div>
    <div id="tools"></div>
    <div id="card"></div>
    <div id="zoom"><button id="zOut">−</button><span id="zVal">100%</span><button id="zIn">+</button><button id="zFit" title="适应">适应</button></div>
    <div id="corner"><button class="btn" id="whyBtn">💡 为什么</button><button class="btn" id="findBtn">📝 我的发现</button></div>
    <div id="toast"></div>
  </main>

  <aside id="lib">
    <div class="hd"><input class="search" id="libSearch" placeholder="搜索器材"></div>
    <div class="body" id="libBody"></div>
  </aside>
</div>
<div id="ghost"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
'use strict';
/* ========== 精确有理数 ========== */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
function Q(n,d=1){if(!Number.isInteger(n)||!Number.isInteger(d)||d===0)throw new Error('bad-number');if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
const qadd=(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d), qsub=(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d);
const qeq=(a,b)=>a.n===b.n&&a.d===b.d, qnum=a=>a.n/a.d, qs=a=>a.d===1?String(a.n):a.n+'/'+a.d;

/* ========== 器材注册表：每种器材 = 属性 + 端口 + 引擎规则 + 画法 ========== */
const TYPES={
 num:{label:'数字卡',group:'数与运算',prefix:'数',out:'value',defaults:{v:3},
   fields:[{k:'v',label:'值',min:-10,max:20}],size:()=>[96,62]},
 frac:{label:'分数条',group:'分数',prefix:'分数条',out:'value',defaults:{n:1,d:2},
   fields:[{k:'n',label:'分子（涂几份）',min:0,max:24},{k:'d',label:'分母（平均分成几份）',min:1,max:12}],
   size:e=>[176,34+Math.max(1,Math.ceil(e.props.n/e.props.d))*28]},
 adder:{label:'合并器',group:'数与运算',prefix:'合并器',out:'value',accepts:'value',defaults:{},fields:[],size:()=>[170,84]},
 numline:{label:'数轴',group:'关系',prefix:'数轴',accepts:'value',defaults:{min:0,max:2},
   fields:[{k:'min',label:'最左',min:-10,max:10},{k:'max',label:'最右',min:-9,max:20}],size:()=>[460,118]},
 balance:{label:'天平',group:'关系',prefix:'天平',accepts:'value',slots:true,defaults:{},fields:[],size:()=>[340,200]},
 fn:{label:'直线',group:'函数',prefix:'直线',out:'fn',defaults:{k:2,b:1},
   fields:[{k:'k',label:'k（斜率：x 加 1，y 加几）',min:-5,max:5},{k:'b',label:'b（和 y 轴交在哪）',min:-10,max:10}],size:()=>[160,64]},
 coord:{label:'坐标平面',group:'函数',prefix:'坐标平面',accepts:'fn',defaults:{},fields:[],size:()=>[340,360]},
 rect:{label:'长方形',group:'图形',prefix:'长方形',defaults:{w:4,h:3},rotate:true,
   fields:[{k:'w',label:'宽',min:1,max:12},{k:'h',label:'长',min:1,max:12}],size:e=>[Math.max(150,e.props.w*20+40),e.props.h*20+84]},
 dice:{label:'两个骰子',group:'概率',prefix:'骰子',defaults:{times:100,counts:null},
   fields:[{k:'times',label:'一次掷几回',min:10,max:2000,step:10}],actions:[{id:'roll',label:'🎲 掷'},{id:'reset',label:'清零'}],size:()=>[320,210]},
};
const GROUP_ORDER=['数与运算','分数','关系','函数','图形','概率'];

/* ========== 世界：一张台面 = 物体 + 连线（场景图） ========== */
let S=blankScene(); // {entities:{id:{id,type,name,x,y,props}}, links:[{id,from,to,slot}], seq:{}}
function blankScene(){return{entities:{},links:[],seq:{},nid:1}}
const clone=o=>JSON.parse(JSON.stringify(o));
function addEnt(s,type,x,y,props){const T=TYPES[type];const id='e'+(s.nid++);s.seq[type]=(s.seq[type]||0)+1;
  s.entities[id]={id,type,name:T.prefix+s.seq[type],x,y,props:Object.assign(clone(T.defaults),props||{})};return id}
function addLink(s,from,to,slot){s.links.push({id:'l'+(s.nid++),from,to,slot:slot||null})}
const inputs=(s,id)=>s.links.filter(l=>l.to===id);
function reach(s,a,b){const seen={};const st=[a];while(st.length){const c=st.pop();if(c===b)return true;if(seen[c])continue;seen[c]=1;s.links.filter(l=>l.from===c).forEach(l=>st.push(l.to))}return false}

/* 动作（意图）。所有改动都走这里：校验 → 改 → 引擎重算。返回 {ok, why} */
function act(a){
  const s=S,E=s.entities;
  try{
  switch(a.t){
  case 'add':{const id=addEnt(s,a.type,a.x,a.y,a.props);return{ok:1,id}}
  case 'move':{const e=E[a.id];e.x=a.x;e.y=a.y;return{ok:1}}
  case 'del':{if(E[a.id]){delete E[a.id];s.links=s.links.filter(l=>l.from!==a.id&&l.to!==a.id)}else s.links=s.links.filter(l=>l.id!==a.id);return{ok:1}}
  case 'dup':{const e=E[a.id];const id=addEnt(s,e.type,e.x+30,e.y+30,clone(e.props));return{ok:1,id}}
  case 'rename':{E[a.id].name=String(a.name).slice(0,16)||E[a.id].name;return{ok:1}}
  case 'rotate':{const p=E[a.id].props;[p.w,p.h]=[p.h,p.w];return{ok:1}}
  case 'reset':{E[a.id].props=clone(TYPES[E[a.id].type].defaults);return{ok:1}}
  case 'set':{const e=E[a.id],T=TYPES[e.type],f=T.fields.find(f=>f.k===a.k);let v=Number(a.v);
    if(!Number.isFinite(v)||!Number.isInteger(v/(f.step||1)))return{ok:0,why:'只能填整数'};
    if(v<f.min||v>f.max)return{ok:0,why:`${f.label.replace(/（.*/,'')}只能在 ${f.min} 到 ${f.max} 之间`};
    if(e.type==='numline'){const o=Object.assign({},e.props,{[a.k]:v});if(o.max-o.min<1)return{ok:0,why:'最右要比最左大'};if(o.max-o.min>20)return{ok:0,why:'数轴最长 20 格'}}
    e.props[a.k]=v;return{ok:1}}
  case 'link':{const f=E[a.from],to=E[a.to];if(!f||!to||a.from===a.to)return{ok:0,why:'连到另一个器材上'};
    const out=TYPES[f.type].out,acc=TYPES[to.type].accepts;
    if(!acc)return{ok:0,why:`${to.name} 不接收输入`};
    if(out!==acc)return{ok:0,why:out==='fn'?'直线只能连到坐标平面上':`${to.name} 只接收直线，不接收数`};
    if(s.links.some(l=>l.from===a.from&&l.to===a.to))return{ok:0,why:'已经连过了'};
    if(reach(s,a.to,a.from))return{ok:0,why:'不能连成一个圈'};
    if(to.type==='balance'&&inputs(s,a.to).filter(l=>l.slot===a.slot).length>=5)return{ok:0,why:'一个盘最多放 5 个'};
    if(to.type==='numline'&&inputs(s,a.to).length>=6)return{ok:0,why:'数轴上最多 6 个点'};
    addLink(s,a.from,a.to,to.type==='balance'?a.slot:null);return{ok:1}}
  case 'roll':{const e=E[a.id];const c=e.props.counts||Array(13).fill(0);for(let i=0;i<e.props.times;i++){c[1+Math.ceil(Math.random()*6)+Math.ceil(Math.random()*6)-1]++}e.props.counts=c;return{ok:1}}
  case 'segclick':{const p=E[a.id].props;p.n=(p.n===a.k?a.k-1:a.k);return{ok:1}}
  }}catch(err){return{ok:0,why:'这个数不合法'}}
  return{ok:0,why:'不认识的操作'};
}

/* ========== 引擎：只有这里算后果。纯函数 scene → derived ========== */
function evaluate(s){
  const E=s.entities,vals={},busy={},D={};
  const val=id=>{if(id in vals)return vals[id];if(busy[id])return null;busy[id]=1;const e=E[id];let v=null;
    if(e.type==='num')v=Q(e.props.v);else if(e.type==='frac')v=Q(e.props.n,e.props.d);
    else if(e.type==='adder'){v=Q(0);for(const l of inputs(s,id)){const x=val(l.from);if(x)v=qadd(v,x)}}
    return vals[id]=v};
  for(const id in E){const e=E[id],d=D[id]={read:[],sig:[]};
    const sig=(lv,tx)=>d.sig.push({lv,tx});
    if(TYPES[e.type].out==='value')d.value=val(id);
    if(e.type==='frac'){const v=d.value;if(e.props.n>e.props.d)sig('info',`比 1 大：${qs(v)} = ${Math.floor(e.props.n/e.props.d)} 又 ${e.props.n%e.props.d}/${e.props.d}`);else if(v.d!==e.props.d)sig('info',`${e.props.n}/${e.props.d} 和 ${qs(v)} 一样大`)}
    if(e.type==='adder'){const ins=inputs(s,id).map(l=>val(l.from)).filter(Boolean);d.terms=ins;
      if(!ins.length)sig('info','把几个数连进来，这里算它们的和');
      else{const ds=[...new Set(ins.map(q=>q.d))];if(ds.length>1){const L=ds.reduce(lcm);sig('info',`分母不同：都换成 ${L} 份再加`)}}}
    if(e.type==='numline'){const {min,max}=e.props;d.pts=inputs(s,id).map(l=>({from:l.from,v:val(l.from)})).filter(p=>p.v);

 {id:'wp03',grade:1,kind:'add',a:5,b:6,title:'小猫吃了 5 条鱼，又吃了 6 条，一共吃了几条？',why:'两次吃的合起来：5 + 6 = 11。'},
 {id:'wp04',grade:1,kind:'add',a:4,b:9,title:'停车场有 4 辆车，又开来 9 辆，一共几辆？',why:'4 + 9 = 13。先把 9 拆成 6 和 3，4 + 6 = 10，再加 3。'},
 {id:'wp05',grade:1,kind:'add',a:7,b:8,title:'小明有 7 颗糖，妈妈又给他 8 颗，一共几颗？',why:'7 + 8 = 15。'},
 {id:'wp06',grade:1,kind:'diff',a:9,b:2,title:'盒子里有 9 个球，拿走 2 个，还剩几个？',why:'拿走几个，就是从 9 里减去 2：9 − 2 = 7。数轴上两点的距离就是这个差。'},
 {id:'wp07',grade:1,kind:'diff',a:6,b:4,title:'红花 6 朵，黄花 4 朵，红花比黄花多几朵？',why:'比多少就是求两数的差：6 − 4 = 2。'},
 {id:'wp08',grade:1,kind:'diff',a:14,b:8,title:'桌上有 14 个杯子，收走 8 个，还剩几个？',why:'14 − 8 = 6。'},
 {id:'wp09',grade:1,kind:'diff',a:20,b:9,title:'池塘里有 20 只鸭子，飞走 9 只，还剩几只？',why:'20 − 9 = 11。'},
 {id:'wp10',grade:1,kind:'diff',a:8,b:5,title:'草地上有 8 只羊，跑走 5 只，还剩几只？',why:'8 − 5 = 3。'},
 {id:'wp11',grade:2,kind:'add',a:16,b:9,title:'妈妈买了 16 个包子，爸爸买了 9 个包子，一共几个？',why:'16 + 9 = 25。先凑整十：16 + 4 = 20，再加 5。'},
 {id:'wp12',grade:2,kind:'add',a:26,b:31,title:'二年级有 26 人，三年级有 31 人，两个年级一共几人？',why:'26 + 31 = 57。个位和个位相加，十位和十位相加。'},
 {id:'wp13',grade:2,kind:'add',a:35,b:28,title:'花园里有 35 朵花，又种了 28 朵，一共几朵？',why:'35 + 28 = 63。'},
 {id:'wp14',grade:2,kind:'add',a:42,b:36,title:'图书角有 42 本书，又捐来 36 本，现在有几本？',why:'42 + 36 = 78。'},
 {id:'wp15',grade:2,kind:'diff',a:15,b:11,title:'小华跳绳 15 下，小丽跳绳 11 下，小华比小丽多跳几下？',why:'15 − 11 = 4。'},
 {id:'wp16',grade:2,kind:'diff',a:40,b:15,title:'小刚有 40 张卡片，送给小明 15 张，还剩几张？',why:'40 − 15 = 25。'},
 {id:'wp17',grade:2,kind:'diff',a:50,b:18,title:'一根绳子 50 厘米，剪掉 18 厘米，还剩几厘米？',why:'50 − 18 = 32。'},
 {id:'wp18',grade:2,kind:'diff',a:18,b:12,title:'红气球 18 个，黄气球 12 个，红气球比黄气球多几个？',why:'18 − 12 = 6。'},
 {id:'wp19',grade:2,kind:'diff',a:19,b:8,title:'小车上有 19 人，下车 8 人，还剩几人？',why:'19 − 8 = 11。'},
 {id:'wp20',grade:2,kind:'diff',a:52,b:47,title:'一班 52 人，二班 47 人，两班相差几人？',why:'52 − 47 = 5。两班相差，就是两个数的距离。'},
];
function wpAnswer(p){return p.kind==='add'?p.a+p.b:Math.abs(p.a-p.b)}
function wpBuild(p){return function(s){
  if(p.kind==='add'){addEnt(s,'num',60,60,{v:p.a});addEnt(s,'num',60,170,{v:p.b});addEnt(s,'adder',330,110);}
  else{addEnt(s,'num',60,60,{v:p.a});addEnt(s,'num',60,170,{v:p.b});addEnt(s,'numline',120,340,{min:0,max:Math.max(p.a,p.b)+2});}
}}
function wpSteps(p){const ans=wpAnswer(p);
  if(p.kind==='add')return[
    {label:'把两个数都连到合并器',score:1,hint:'拖数字卡右边的蓝点到合并器',target:s=>byType(s,'adder'),check:(s,D)=>{const ad=byType(s,'adder');return !!ad&&inputs(s,ad).length>=2}},
    {label:'合并器算出的和就是答案',score:2,hint:'看合并器的读数，和题目对照',target:s=>byType(s,'adder'),check:(s,D)=>{const ad=byType(s,'adder');return !!ad&&!!D[ad].value&&qeq(D[ad].value,Q(ans))}}];
  return[
    {label:'把两个数都连到数轴',score:1,hint:'拖两个数字卡的蓝点到数轴',target:s=>byType(s,'numline'),check:(s,D)=>{const nl=byType(s,'numline');return !!nl&&inputs(s,nl).length>=2}},
    {label:'数轴上两点相差的数，就是答案',score:2,hint:'看数轴下面的“相差”',target:s=>byType(s,'numline'),check:(s,D)=>{const nl=byType(s,'numline');if(!nl)return false;const vs=inputs(s,nl).map(l=>D[l.from]&&D[l.from].value).filter(Boolean);return vs.length>=2&&Math.abs(qnum(vs[0])-qnum(vs[1]))===ans}}];
}
WP.forEach(p=>XP.push({id:p.id,title:p.title,domain:'应用题',grade:p.grade,tools:p.kind==='add'?'数字卡 · 合并器':'数字卡 · 数轴',q:p.title,why:p.why,build:wpBuild(p),steps:wpSteps(p)}));

function startXp(id,m){xp=XP.find(x=>x.id===id);if(!xp)return;mode=m;S=blankScene();xp.build(S);undoSt=[];redoSt=[];sel=null;cardOpen=false;
  run={steps:xp.steps.map((s,i)=>({i,done:false})),ops:0,errors:0,t0:Date.now(),finished:false};$('title').textContent=xp.title;
  D=evaluate(S);setModeUi();showTab('steps');fit();if(m==='exam')startTimer();toast(m==='exam'?'考试开始：没有提示，10 分钟':'练习：跟着左边的步骤做，下一步要动的器材会发光')}
function setModeUi(){document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  $('timer').style.display=$('submit').style.display=mode==='exam'?'inline-block':'none';$('menuBtn').style.display=mode==='practice'?'inline-block':'none';
  $('whyBtn').style.display=mode==='exam'?'none':'inline-block';stopTimerIf()}
function stopTimerIf(){if(mode!=='exam'&&timerId){clearInterval(timerId);timerId=null}}
function startTimer(){clearInterval(timerId);const end=Date.now()+600000;const tick=()=>{const ms=Math.max(0,end-Date.now());$('timer').textContent=`⏱ ${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`;if(!ms){clearInterval(timerId);timerId=null;submitExam(true)}};tick();timerId=setInterval(tick,500)}
function goFree(){mode='free';xp=null;run=null;sel=null;cardOpen=false;try{S=JSON.parse(localStorage.getItem(LS.free))||blankScene()}catch(e){S=blankScene()}undoSt=[];redoSt=[];$('title').textContent='我的实验';setModeUi();showTab('lib');afterChange()}
$('modeSeg').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const m=b.dataset.mode;
  if(m==='free'){if(mode==='exam'&&!confirm('退出考试？这次不计分。'))return;goFree();return}
  const id=xp?xp.id:(openXp||null);if(!id){$('left').classList.remove('closed');showTab('lib');toast('先在实验库里选一个实验');return}
  if(mode==='exam'&&m!=='exam'&&!confirm('退出考试？这次不计分。'))return;startXp(id,m)};
$('menuBtn').onclick=()=>modal(`<h3>练习菜单</h3><div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-m="re">重置练习</button><button class="btn" data-m="exit">退出练习</button><button class="btn pri" data-m="exam">进入考试</button></div>`);
$('submit').onclick=()=>submitExam(false);
function score(){return xp.steps.reduce((a,s,i)=>a+(run.steps[i].done?s.score:0),0)}
function practiceDone(){modal(`<h3>练习完成 🎉</h3><p>${xp.steps.length} 步全部做对，用了 ${run.ops} 次操作${run.errors?`，有 ${run.errors} 次被台面拒绝`:''}。</p><div class="q"><b>为什么</b><div>${esc(xp.why)}</div></div><div style="display:flex;gap:8px"><button class="btn" data-m="re">再练一次</button><button class="btn pri" data-m="exam">进入考试</button><button class="btn" data-m="lib">返回实验库</button></div>`)}
function submitExam(auto){if(mode!=='exam'||!run)return;clearInterval(timerId);timerId=null;const tot=xp.steps.reduce((a,s)=>a+s.score,0),sc=score();const used=Math.round((Date.now()-run.t0)/1000);
  const H=hist(),h=H[xp.id]||{n:0,lost:{}};h.n++;h.last=`${sc}/${tot}`;xp.steps.forEach((s,i)=>{if(!run.steps[i].done)h.lost[s.label]=(h.lost[s.label]||0)+1});const w=Object.entries(h.lost).sort((a,b)=>b[1]-a[1])[0];h.worst=w?w[0]:'';H[xp.id]=h;localStorage.setItem(LS.hist,JSON.stringify(H));
  // 把考试结果交给主应用（跨次统计）：主页面收到 labNbExam 消息后记入 math-lab-proc-v1。
  try{window.parent&&window.parent!==window&&window.parent.postMessage({type:'labNbExam',payload:{labId:xp.id,title:xp.title,score:sc,max:tot,opCount:run.ops,lines:xp.steps.map((s,i)=>({id:s.label,got:!!run.steps[i].done}))}},'*')}catch(e){}
  const lost=xp.steps.filter((s,i)=>!run.steps[i].done);
  modal(`<h3>${auto?'时间到，':''}考试报告</h3><div class="score">${sc}<span class="muted" style="font-size:18px"> / ${tot}</span></div><div class="muted">用时 ${Math.floor(used/60)} 分 ${used%60} 秒 · 操作 ${run.ops} 次 · 被拒绝 ${run.errors} 次</div>
   <ul class="rep">${xp.steps.map((s,i)=>`<li class="${run.steps[i].done?'':'lost'}"><span>${run.steps[i].done?'✓':'×'} ${esc(s.label)}</span><span>${run.steps[i].done?s.score:0}/${s.score}</span></li>`).join('')}</ul>
   ${lost.length?`<div class="q">丢分在：${lost.map(s=>esc(s.label)).join('；')}。去练习模式把这几步再做一遍。</div>`:'<div class="q">满分！</div>'}
   <div style="display:flex;gap:8px"><button class="btn pri" data-m="exam">再考一次</button><button class="btn" data-m="practice">回练习</button><button class="btn" data-m="lib">返回实验库</button></div>`);
  run.finished=true}
function modal(h){$('modalBox').innerHTML=h;$('modal').style.display='grid'}
$('modal').onclick=ev=>{const b=ev.target.closest('[data-m]');if(ev.target===$('modal')){$('modal').style.display='none';return}if(!b)return;const m=b.dataset.m,id=xp&&xp.id;$('modal').style.display='none';
  if(m==='re')startXp(id,'practice');else if(m==='exam')startXp(id,'exam');else if(m==='practice')startXp(id,'practice');else if(m==='exit'||m==='lib')goFree();else if(m==='savefind'){const t=$('findTx').value.trim();if(t){const a=JSON.parse(localStorage.getItem(LS.find)||'[]');a.unshift({t,at:new Date().toLocaleString(),xp:xp?xp.title:'自由探究'});localStorage.setItem(LS.find,JSON.stringify(a.slice(0,50)));toast('记下了')}}};
$('whyBtn').onclick=()=>{if(!xp){modal('<h3>为什么</h3><p>自由探究没有标准答案。台面上的每个结果都是按数学规律算出来的——试着改一个数，猜猜会发生什么，再看看猜对没有。</p>');return}
  if(mode==='practice'&&!run.finished){modal(`<h3>为什么</h3><p>先自己做完再看——发现之后再讲，记得更牢。</p>`);return}modal(`<h3>为什么</h3><p>${esc(xp.why)}</p>`)};
$('findBtn').onclick=()=>{const a=JSON.parse(localStorage.getItem(LS.find)||'[]');modal(`<h3>我的发现</h3><textarea id="findTx" placeholder="我发现……"></textarea><div style="display:flex;gap:8px;margin:8px 0"><button class="btn pri" data-m="savefind">记下来</button></div>${a.slice(0,5).map(f=>`<div class="muted" style="font-size:12px;margin-top:6px">${esc(f.at)} · ${esc(f.xp)}<br><span style="color:var(--tx)">${esc(f.t)}</span></div>`).join('')}`)};

let toastT;function toast(t,err){const el=$('toast');el.textContent=t;el.className=err?'err':'';el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',2600)}
window.addEventListener('resize',render);
renderLib();renderXpList();goFree();
window.__lab={get S(){return S},act,evaluate,commit,startXp,XP,get run(){return run},submitExam,goFree};
</script>
