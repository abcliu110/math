<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>数学实验室 · 工作台</title>
<style>
:root{--bar:#121822;--panel:#18202c;--panel2:#202a38;--line:#2c3848;--stage:#1b2431;--grid:#232e3d;--tx:#e6ecf3;--mut:#8a98ab;--acc:#3b9cff;--ok:#2fbf71;--warn:#f0a63a;--err:#ff5b5b;--card:#f6f8fb;--ink:#1d2633}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bar);color:var(--tx);font:14px/1.45 "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:auto 1fr 248px;height:100%}
/* 顶栏 */
#top{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line)}
#top .logo{font-weight:700;letter-spacing:.5px;margin-right:6px}
#title{min-width:120px;max-width:340px;padding:4px 8px;border-radius:6px;outline:0;white-space:nowrap;overflow:hidden}
#title:hover,#title:focus{background:var(--panel2)}
.seg{display:flex;background:var(--panel2);border-radius:8px;padding:3px}
.seg button{padding:5px 12px;border-radius:6px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.tb{padding:6px 10px;border-radius:7px;color:var(--mut)}.tb:hover{background:var(--panel2);color:var(--tx)}
.tb[disabled]{opacity:.35;pointer-events:none}
.sp{flex:1}
#timer{font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:7px;background:#2a1f1f;color:#ffb4b4;display:none}
#submit{display:none;background:var(--err);color:#fff;padding:6px 14px;border-radius:7px;font-weight:600}
#menuBtn{display:none}
/* 左栏 */
#left{grid-row:2;width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:width .2s}
#left.closed{width:0;overflow:hidden;border:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 0;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-color:var(--acc)}
.pane{flex:1;overflow:auto;padding:12px;min-height:0}
.search{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);outline:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--mut);font-size:12px}
.chip.on{background:#1f3b5c;color:#cfe6ff}
.xp{padding:10px 12px;border-radius:10px;background:var(--panel2);margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.xp:hover{border-color:var(--line)}.xp.on{border-color:var(--acc)}
.xp b{display:block;margin-bottom:3px}.xp small{color:var(--mut)}
.detail{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);color:var(--mut);font-size:13px}
.detail .row{display:flex;gap:8px;margin-top:8px}
.btn{padding:7px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--tx)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.red{background:var(--err);border-color:var(--err);color:#fff}
.step{display:flex;gap:10px;padding:10px;border-radius:10px;margin-bottom:8px;background:var(--panel2);border:1px solid transparent}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px}
.step.done .n{background:var(--ok);color:#fff}.step.cur{border-color:var(--acc)}
.step.cur .n{background:var(--acc);color:#fff}
.step .hint{color:#9fd0ff;font-size:12px;margin-top:4px}
.step .sc{margin-left:auto;color:var(--mut);font-size:12px;flex:none}
.muted{color:var(--mut)}
.q{padding:10px 12px;border-radius:10px;background:#1f3047;margin-bottom:12px}
/* 舞台 */
#stageWrap{grid-row:2;position:relative;overflow:hidden;background:var(--stage)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage.panning{cursor:grabbing}
.ent-body{fill:var(--card);stroke:#c9d3df;stroke-width:1}
.ent.sel .ent-body{stroke:#9aa9bb}
.ent.err .ent-body{stroke:var(--err);stroke-width:2}
.ent.ok .ent-body{stroke:var(--ok);stroke-width:2}
.ent.is-next .ent-body{stroke:var(--acc);stroke-width:3;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.35}}
.selbox{fill:none;stroke:#cfd8e3;stroke-dasharray:5 4;stroke-width:1.5;pointer-events:none}
.ttl{fill:#6b7889;font-size:12px}
.big{fill:var(--ink);font-weight:700}
.ink{fill:var(--ink)}
.port-out{fill:var(--acc);stroke:#fff;stroke-width:2;cursor:crosshair}
.port-hit{fill:transparent;cursor:crosshair}
.vtx{fill:#fff;stroke:#92400e;stroke-width:2.5;cursor:grab}
.vtx-hit{fill:transparent;cursor:grab}
@media (pointer:coarse){#tools button,#card .pm,#card .btn,.btn{min-width:44px;min-height:44px}}
.port-in{fill:#fff;stroke:#9aa9bb;stroke-width:2;pointer-events:none}
.link{fill:none;stroke:#7fc1ff;stroke-width:2.5;stroke-dasharray:7 6;animation:flow 0.9s linear infinite;pointer-events:none}
.link.sel{stroke:#ffd166;stroke-width:3.5}
.linkhit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.templink{fill:none;stroke:#ffd166;stroke-width:2;stroke-dasharray:4 4;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-13}}
.flowline{stroke-dasharray:8 6;animation:flow 0.9s linear infinite}
.seg-cell{cursor:pointer}
.pill rect{rx:10}
.pill text{font-size:12px}
/* 浮动 */
#tools{position:absolute;display:none;flex-direction:column;gap:2px;background:#0f141c;border-radius:8px;padding:4px;box-shadow:0 6px 18px #0008}
#tools button{width:32px;height:32px;border-radius:6px;font-size:15px}
#tools button:hover{background:var(--panel2)}
#card{position:absolute;display:none;width:250px;background:#0f141cf2;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 10px 28px #000a}
#card h4{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:500}
#card .state{font-size:20px;font-weight:700;margin-bottom:8px}
.linkval{font-size:12px;font-weight:700;fill:#c7e6ff;paint-order:stroke;stroke:#0b1220;stroke-width:3px;pointer-events:none}
.link.dep{stroke:#ffd166;stroke-width:3.5}
.ent.dep-up .ent-body{stroke:#7fc1ff;stroke-width:3}
.ent.dep-down .ent-body{stroke:#ffd166;stroke-width:3}
.ent.drop-ok .ent-body{stroke:#2fbf71;stroke-width:3.5}
.ent.drop-no{opacity:.4}
.seg-choice{display:flex;flex-wrap:wrap;gap:6px}
.seg-choice .pm{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#1b2431;color:var(--tx)}
.seg-choice .pm.on{border-color:var(--acc);background:#1d3a5c}
#card .derived{font-size:12px;color:var(--mut);margin:6px 0 2px;padding:6px 8px;border-radius:8px;background:#ffffff0d}
#card .why-err{color:#ff8a8a;font-size:12px;margin-top:10px;padding:6px 8px;border-radius:8px;background:#3a1c1c}
.fld{margin:8px 0}.fld label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.fld .ctl{display:flex;align-items:center;gap:6px;margin-top:4px}
.fld input[type=range]{flex:1;accent-color:var(--acc)}
.fld input[type=number],#card .name{width:58px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);outline:0}
#card .name{width:100%;margin-bottom:6px}
.pm{width:26px;height:26px;border-radius:6px;background:var(--panel2)}
.card-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card-row .btn{padding:5px 9px;font-size:12px}
#zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:2px;background:#0f141cd9;border-radius:9px;padding:3px;align-items:center}
#zoom button{min-width:30px;padding:0 6px;height:28px;border-radius:6px}#zoom button:hover{background:var(--panel2)}
#zoom span{min-width:46px;text-align:center;font-size:12px;color:var(--mut)}
#corner{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
#corner .btn{background:#0f141cd9}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:8px 14px;border-radius:9px;background:#0f141cf0;border:1px solid var(--line);display:none;max-width:70%}
#toast.err{border-color:var(--err);color:#ffc2c2}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#5d6b7e;text-align:center}
/* 器材架 */
#lib{grid-row:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#lib .hd{padding:12px;border-bottom:1px solid var(--line)}
#lib .body{flex:1;overflow:auto;padding:10px 12px}
.grp{font-size:12px;color:var(--mut);margin:10px 0 6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel2);border-radius:10px;padding:8px 6px;text-align:center;cursor:grab;border:1px solid transparent;touch-action:none}
.tile:hover{border-color:var(--acc)}
.tile svg{display:block;margin:0 auto 4px}
.tile span{font-size:12px}
#ghost{position:fixed;pointer-events:none;display:none;padding:6px 10px;border-radius:8px;background:var(--acc);color:#fff;font-size:12px;z-index:9}
.templink{pointer-events:none}
.rz{cursor:nwse-resize;fill:#fff;stroke:#2563eb;stroke-width:2}
/* 弹窗 */
#modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:10}
#modal .box{width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
#modal h3{margin:0 0 10px}
.score{font-size:40px;font-weight:800}
.rep{margin:10px 0;padding:0;list-style:none}.rep li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.rep .lost{color:#ffb4b4}
textarea{width:100%;min-height:90px;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
@media (max-width:900px){#app{grid-template-columns:auto 1fr 0}#lib{display:none}#left{width:260px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="tb" id="toggleLeft" title="实验库/步骤">≡</button>
    <span class="logo">数学实验室</span>
    <div id="title" contenteditable="true" spellcheck="false">我的实验</div>
    <div class="seg" id="modeSeg">
      <button data-mode="free" class="on">自由探究</button>
      <button data-mode="practice">练习</button>
      <button data-mode="exam">考试</button>
    </div>
    <button class="tb" id="menuBtn">菜单</button>
    <span class="sp"></span>
    <button class="tb" id="undo" title="撤销 Ctrl+Z">撤销</button>
    <button class="tb" id="redo" title="重做 Ctrl+Y">重做</button>
    <button class="tb" id="tidy" title="一键整理">整理</button>
    <button class="tb" id="clear">清空台面</button>
    <span id="timer">10:00</span>
    <button id="submit">提交</button>
  </header>

  <aside id="left">
    <div class="tabs"><button data-tab="lib" class="on">实验库</button><button data-tab="steps">步骤</button></div>
    <div class="pane" id="paneLib"></div>
    <div class="pane" id="paneSteps" style="display:none"></div>
  </aside>

  <main id="stageWrap">
    <svg id="stage"><defs>
      <pattern id="gridS" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#212b39" stroke-width="1"/></pattern>
      <pattern id="gridL" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gridS)"/><path d="M100 0H0V100" fill="none" stroke="#283446" stroke-width="1"/></pattern>
      <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
    </defs><rect id="bg" width="100%" height="100%" fill="url(#gridL)"/><g id="world"></g></svg>
    <div id="empty"><div><div style="font-size:18px;margin-bottom:6px">台面是空的</div>从右边器材架拖一个器材上来，或在左边选一个实验</div></div>
    <div id="tools"></div>
    <div id="card"></div>
    <div id="zoom"><button id="zOut">−</button><span id="zVal">100%</span><button id="zIn">+</button><button id="zFit" title="适应">适应</button></div>
    <div id="corner"><button class="btn" id="whyBtn">💡 为什么</button><button class="btn" id="findBtn">📝 我的发现</button></div>
    <div id="toast"></div>
  </main>

  <aside id="lib">
    <div class="hd"><input class="search" id="libSearch" placeholder="搜索器材"></div>
    <div class="body" id="libBody"></div>
  </aside>
</div>
<div id="ghost"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
'use strict';
/* ========== 精确有理数 ========== */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
function Q(n,d=1){if(!Number.isInteger(n)||!Number.isInteger(d)||d===0)throw new Error('bad-number');if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
const qadd=(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d), qsub=(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d);
const qeq=(a,b)=>a.n===b.n&&a.d===b.d, qnum=a=>a.n/a.d, qs=a=>a.d===1?String(a.n):a.n+'/'+a.d;

/* ========== 器材注册表：每种器材 = 属性 + 端口 + 引擎规则 + 画法 ========== */
const TYPES={
 var:{label:'变量 x（可改名）',group:'数与运算',prefix:'x',out:'value',defaults:{v:0},fields:[{k:'v',label:'x 的值',min:-10,max:30}],size:()=>[110,62]},
  num:{label:'数字卡',group:'数与运算',prefix:'数',out:'value',defaults:{v:3},
   fields:[{k:'v',label:'值',min:-10,max:20}],size:()=>[96,62]},
 frac:{label:'分数条',group:'分数',prefix:'分数条',out:'value',defaults:{n:1,d:2},
   fields:[{k:'n',label:'分子（涂几份）',min:0,max:24},{k:'d',label:'分母（平均分成几份）',min:1,max:12}],
   size:e=>[176,34+Math.max(1,Math.ceil(e.props.n/e.props.d))*28]},
 adder:{label:'合并器',group:'数与运算',prefix:'合并器',out:'value',accepts:'value',defaults:{op:0},fields:[{k:'op',label:'运算',min:0,max:1,choices:['加','减（第一个数减去后面的）']}],size:()=>[170,84]},
 mul:{label:'乘法器',group:'数与运算',prefix:'乘法器',out:'value',accepts:'value',defaults:{times:1},fields:[{k:'times',label:'再乘一个数（1 是不乘）',min:1,max:10}],size:()=>[170,84]},
 div:{label:'除法器',group:'数与运算',prefix:'除法器',out:'value',accepts:'value',slots:true,defaults:{mode:0},fields:[{k:'mode',label:'算什么',min:0,max:1,choices:['商（分成几份）','余数']}],size:()=>[200,110]},
 money:{label:'人民币',group:'数与运算',prefix:'人民币',out:'value',defaults:{yuan:1,jiao:0,fen:0},fields:[{k:'yuan',label:'元',min:0,max:99},{k:'jiao',label:'角',min:0,max:9},{k:'fen',label:'分',min:0,max:9}],size:()=>[190,62]},
 clock:{label:'钟面',group:'图形',prefix:'钟面',out:'value',dim:'time',defaults:{h:3,m:0},fields:[{k:'h',label:'时（几点）',min:1,max:12},{k:'m',label:'分',min:0,max:55,step:5}],size:()=>[180,200]},
 angle:{label:'角',group:'图形',prefix:'角',defaults:{deg:90},fields:[{k:'deg',label:'度数（0 到 180）',min:0,max:180,step:5}],size:()=>[200,160]},
 bars:{label:'条形统计图',group:'统计',prefix:'统计图',defaults:{a:4,b:6,c:3},fields:[{k:'a',label:'一班（人）',min:0,max:30},{k:'b',label:'二班（人）',min:0,max:30},{k:'c',label:'三班（人）',min:0,max:30}],size:()=>[220,190]},
 tri:{ports:(p)=>({third:180-p.a-p.b}),label:'三角形',group:'图形',prefix:'三角形',defaults:{a:30,b:40},fields:[{k:'a',label:'第一个角（度）',min:1,max:150},{k:'b',label:'第二个角（度）',min:1,max:150}],size:()=>[240,170]},
 para:{label:'平行四边形',group:'图形',prefix:'平行四边形',defaults:{base:6,h:4},fields:[{k:'base',label:'底（格）',min:1,max:12},{k:'h',label:'高（格）',min:1,max:12}],size:()=>[240,170]},
 line:{ports:(p)=>({d12:p.y2-p.y1,d23:p.y3-p.y2}),label:'折线统计图',group:'统计',prefix:'折线图',defaults:{y1:3,y2:6,y3:4},fields:[{k:'y1',label:'第一年（万元）',min:0,max:12},{k:'y2',label:'第二年（万元）',min:0,max:12},{k:'y3',label:'第三年（万元）',min:0,max:12}],size:()=>[220,190]},
 cage:{ports:(p)=>{const c=p.heads-p.rabbits,got=4*p.rabbits+2*c;return{chickens:c,rabbits:p.rabbits,solved:c>=0&&got===p.legs}},label:'鸡兔笼',group:'数与运算',prefix:'鸡兔笼',defaults:{heads:35,legs:94,rabbits:0},fields:[{k:'heads',label:'头（总数）',min:1,max:60},{k:'legs',label:'腿（总数）',min:0,max:200,step:2},{k:'rabbits',label:'兔（只）',min:0,max:60}],size:()=>[220,150]},
 pair:{label:'数对',group:'关系',prefix:'数对',defaults:{x:3,y:2},fields:[{k:'x',label:'第几列（x）',min:0,max:8},{k:'y',label:'第几行（y）',min:0,max:8}],size:()=>[240,240]},
 shape:{label:'图形（平移、旋转、对称）',group:'图形',prefix:'图形',defaults:{dx:0,rot:0,mirror:0},fields:[{k:'dx',label:'向右平移（格）',min:0,max:6},{k:'rot',label:'旋转（度，逆时针）',min:0,max:270,step:90},{k:'mirror',label:'轴对称（0 不做，1 做）',min:0,max:1,choices:['不做','做']}],size:()=>[260,190]},
 solid:{label:'立体图形（观察）',group:'图形',prefix:'立体图形',defaults:{view:0},fields:[{k:'view',label:'看的方向（0 正面，1 侧面，2 上面）',min:0,max:2,choices:['正面','侧面','上面']}],size:()=>[240,190]},
 circle:{ports:(p)=>({circ:Number((2*3.14*p.r).toFixed(2)),area:Number((3.14*p.r*p.r).toFixed(2))}),label:'圆',group:'图形',prefix:'圆',defaults:{r:2},fields:[{k:'r',label:'半径（厘米）',min:1,max:10}],size:()=>[200,200]},
 pie:{ports:(p)=>({sum:p.a+p.b+p.c,angleA:Number((p.a*3.6).toFixed(0))}),label:'扇形统计图',group:'统计',prefix:'扇形图',defaults:{a:40,b:30,c:30},fields:[{k:'a',label:'一班（%）',min:0,max:100,step:5},{k:'b',label:'二班（%）',min:0,max:100,step:5},{k:'c',label:'三班（%）',min:0,max:100,step:5}],size:()=>[220,220]},
 sim:{ports:(p)=>({ratio:p.k,areaRatio:p.k*p.k}),label:'相似图形（放大缩小）',group:'图形',prefix:'相似图形',defaults:{k:1},fields:[{k:'k',label:'相似比（放大几倍）',min:1,max:3}],size:()=>[260,190]},
 pyth:{ports:(p)=>{const c=Math.sqrt(p.a*p.a+p.b*p.b);return{c:c,triple:Number.isInteger(c)}},label:'直角三角形（勾股定理）',group:'图形',prefix:'直角三角形',defaults:{a:3,b:2},fields:[{k:'a',label:'直角边 a',min:1,max:12},{k:'b',label:'直角边 b',min:1,max:12}],size:()=>[240,190]},

const GROUP_ORDER=['数与运算','分数','关系','函数','图形','统计','概率'];
/* 多输出端口：除了默认的输出（dy 为中点），这些器材还有额外的输出口。dy 是端口在器材上的纵坐标。 */
const OUT_PORTS={table:[{id:'sum',label:'合计',dy:25},{id:'mean',label:'平均',dy:100},{id:'max',label:'最大',dy:125}],balance:[{id:'equal',label:'平衡',dy:170}],dice:[{id:'tot',label:'次数',dy:150},{id:'best',label:'最多点数',dy:186},{id:'dist',label:'分布',dy:114}]};
// 一个输出口的类型：天平的“平衡”是 bool（是或否），其它输出口按器材类型。
const outKind=(f,port)=>(f.type==='balance'&&port==='equal')?'bool':port==='dist'?'dist':port?'value':TYPES[f.type].out;
/* 立体图形：每行是一排（y），每个数是这一格上摞的小方块个数（x 从左到右）。 */
const SOLID_H=[[2,1],[1,0]];

/* ========== 世界：一张台面 = 物体 + 连线（场景图） ========== */
let S=blankScene(); // {entities:{id:{id,type,name,x,y,props}}, links:[{id,from,to,slot}], seq:{}}
function blankScene(){return{entities:{},links:[],seq:{},nid:1}}
const clone=o=>JSON.parse(JSON.stringify(o));
function addEnt(s,type,x,y,props){const T=TYPES[type];const id='e'+(s.nid++);s.seq[type]=(s.seq[type]||0)+1;
  s.entities[id]={id,type,name:T.prefix+s.seq[type],x,y,props:Object.assign(clone(T.defaults),props||{})};return id}
function addLink(s,from,to,slot,fromPort){s.links.push({id:'l'+(s.nid++),from,to,slot:slot||null,...(fromPort?{fromPort}:{})})}
const inputs=(s,id)=>s.links.filter(l=>l.to===id);
/* 维度：这个器材算出的数是什么东西。只有“个数”和“面积”两种需要区分；合并和比较时要求同一种。 */
/* 维度代数：每个维度是基本量的指数表（长度 L、重量 W、钱 Y、时间 T、角度 A、比值 R）。
   面积 = 长度²，体积 = 长度³。个数是 1（指数表为空）。乘法器的维度 = 各输入维度之积（指数相加），
   合并器要求输入同维度，比较类器材按这张表拒绝不该放的维度。 */
const DIM_VEC={count:{},length:{L:1},area:{L:2},volume:{L:3},weight:{W:1},money:{Y:1},time:{T:1},angle:{A:1},ratio:{R:1}};
const DIM_NAME={count:'个数',length:'长度',area:'面积',volume:'体积',weight:'重量',money:'钱',time:'时间',angle:'角度',ratio:'比值'};
const vecKey=v=>Object.keys(v).filter(k=>v[k]).sort().map(k=>k+v[k]).join(',')||'count';
const vecMul=(a,b)=>{const r={...a};for(const k in b)r[k]=(r[k]||0)+b[k];for(const k in r)if(!r[k])delete r[k];return r};
function dimName(v){const k=vecKey(v);for(const n in DIM_VEC)if(vecKey(DIM_VEC[n])===k)return n;return'other:'+k}
function dimVec(s,id,depth=0){const e=s.entities[id];if(!e||depth>40)return{};
  if(e.type==='adder'){const l=inputs(s,id)[0];return l?dimVec(s,l.from,depth+1):{}}
  if(e.type==='mul'){let v={};for(const l of inputs(s,id))v=vecMul(v,dimVec(s,l.from,depth+1));return v}
  return DIM_VEC[TYPES[e.type].dim||'count']}
function dimOf(s,id){return dimName(dimVec(s,id))}
function dimLabel(n){return DIM_NAME[n]||n}
/* 依赖关系：连线和绑定都算。从 a 能走到 b，说明 b 的值依赖 a（或 a 绑着 b 的属性）。 */
function reachAll(s,a,b){const seen={};const st=[a];while(st.length){const c=st.pop();if(c===b)return true;if(seen[c])continue;seen[c]=1;s.links.filter(l=>l.from===c).forEach(l=>st.push(l.to));(s.binds||[]).filter(x=>x.from===c).forEach(x=>st.push(x.to))}return false}
/* 绑定同步：把绑定的值写进目标属性。改一次算几遍，直到不再变（绑定链最多 8 层）。 */
/* 属性表达式（最小版）：文字里可以写器材的名字、数字，以及 + − × ÷ 和括号。名字按最长匹配认。 */
function exprTokens(s,text){const names=Object.values(s.entities).filter(e=>e.name).sort((a,b)=>b.name.length-a.name.length);const toks=[];let i=0;
  while(i<text.length){const ch=text[i];if(/\s/.test(ch)){i++;continue}const rest=text.slice(i);const nm=names.find(n=>rest.startsWith(n.name));
    if(nm){toks.push({ref:nm.id});i+=nm.name.length;continue}
    let m=rest.match(/^\d+(\.\d+)?/);if(m){toks.push({num:m[0]});i+=m[0].length;continue}
    m=rest.match(/^[+\-−×÷*\/()]/);if(m){toks.push({op:m[0]});i+=1;continue}
    return null}
  return toks}
function evalTokens(toks,getVal){let p=0;
  const factor=()=>{const t=toks[p++];if(!t)throw new Error('end');if(t.num!==undefined){const parts=t.num.split('.');const d=parts[1]?Math.pow(10,parts[1].length):1;return Q(Math.round(parseFloat(t.num)*d),d)}
    if(t.ref!==undefined){const v=getVal(t.ref);if(!v)throw new Error('novalue');return v}
    if(t.op==='('){const v=expr();if(!toks[p]||toks[p].op!==')')throw new Error('paren');p++;return v}
    throw new Error('bad')};
  const term=()=>{let v=factor();while(toks[p]&&['×','*','÷','/'].includes(toks[p].op)){const o=toks[p++].op;const w=factor();if(o==='×'||o==='*')v=Q(v.n*w.n,v.d*w.d);else{if(w.n===0)throw new Error('div0');v=Q(v.n*w.d,v.d*w.n)}}return v};
  const expr=()=>{let v=term();while(toks[p]&&['+','-','−'].includes(toks[p].op)){const o=toks[p++].op;const w=term();v=o==='+'?qadd(v,w):qsub(v,w)}return v};
  const r=expr();if(p!==toks.length)throw new Error('trail');return r}
const srcsOf=b=>b.expr?b.refs:[b.from];
// 表达式的值：按 Dd（evaluate 的结果）读来源；有一处算不出来就是 null。
function exprValue(s,b,Dd){const toks=exprTokens(s,b.expr);if(!toks)return null;try{return evalTokens(toks,id=>{const x=Dd[id]&&qv(Dd[id]);return x||null})}catch(e){return null}}
// 给一个字段绑表达式。返回 {ok, why}。同一字段原来的绑定会被替换。
function addExprBind(s,to,k,text){const t0=s.entities[to];if(!t0)return{ok:0,why:'没有这个器材'};if(!TYPES[t0.type].fields.some(f=>f.k===k))return{ok:0,why:'这个器材没有这个属性'};
  const toks=exprTokens(s,text);if(!toks)return{ok:0,why:'表达式里有认不出的字'};
  const refs=toks.filter(t=>t.ref!==undefined).map(t=>t.ref);if(!refs.length)return{ok:0,why:'表达式里要有一个器材的名字'};
  if(refs.some(r=>r===to||reachAll(s,to,r)))return{ok:0,why:'绕回来了：它的值已经依赖这个器材，不能再绑'};
  const old=(s.binds||[]).find(b=>b.to===to&&b.k===k);const prev=old?old.prev:s.entities[to].props[k];
  s.binds=(s.binds||[]).filter(b=>!(b.to===to&&b.k===k));s.binds.push({from:refs[0],to,k,expr:text,refs,prev});return{ok:1}}
/* 绑定同步按拓扑序做：绑定 o 的目标若能走到绑定 b 的来源，o 先算，b 再读它的值。每条绑定只写一次，没有“最多 8 遍”的上限。 */
function syncBinds(s){if(!s.binds||!s.binds.length)return;
  // 清掉已经悬空的绑定（来源或目标器材不存在，比如旧存档里的）；不然求值会读到不存在的器材。
  s.binds=s.binds.filter(b=>s.entities[b.to]&&srcsOf(b).every(id=>s.entities[id]));if(!s.binds.length)return;
  const left=s.binds.slice(),order=[];
  while(left.length){let i=left.findIndex(b=>!left.some(o=>o!==b&&srcsOf(b).some(r=>reachAll(s,o.to,r))));if(i<0)i=0;order.push(left.splice(i,1)[0])}
  for(const b of order){const Dd=evaluate(s);const to=s.entities[b.to],src=b.expr?exprValue(s,b,Dd):(Dd[b.from]&&qv(Dd[b.from]));if(!to||!src||src.d!==1)continue;const F=TYPES[to.type].fields.find(f=>f.k===b.k);if(!F||src.n<F.min||src.n>F.max)continue;to.props[b.k]=src.n}}
function reach(s,a,b){const seen={};const st=[a];while(st.length){const c=st.pop();if(c===b)return true;if(seen[c])continue;seen[c]=1;s.links.filter(l=>l.from===c).forEach(l=>st.push(l.to))}return false}

/* 动作（意图）。所有改动都走这里：校验 → 改 → 引擎重算。返回 {ok, why} */
function act(a){const r=actRaw(a);if(r.ok)syncBinds(S);return r}
function actRaw(a){
  const s=S,E=s.entities;
  try{
  switch(a.t){
  case 'add':{const id=addEnt(s,a.type,a.x,a.y,a.props);return{ok:1,id}}
  case 'move':{const e=E[a.id];e.x=a.x;e.y=a.y;return{ok:1}}
  case 'del':{if(E[a.id]){delete E[a.id];s.links=s.links.filter(l=>l.from!==a.id&&l.to!==a.id);s.binds=(s.binds||[]).filter(b=>b.to!==a.id&&!srcsOf(b).includes(a.id))}else s.links=s.links.filter(l=>l.id!==a.id);return{ok:1}}
  case 'dup':{const e=E[a.id];const id=addEnt(s,e.type,e.x+30,e.y+30,clone(e.props));return{ok:1,id}}
  case 'rename':{E[a.id].name=String(a.name).slice(0,16)||E[a.id].name;return{ok:1}}
  case 'rotate':{const p=E[a.id].props;p.rot=((p.rot||0)+15)%360;return{ok:1}}
  case 'vtx':{const e=E[a.id];if(!e||e.type!=='tri')return{ok:0,why:'这里不是三角形'};const [w,h]=TYPES[e.type].size(e);
    // 拖顶点：由顶点位置反推两个底角。a 在左底角，b 在右底角。
    let A=Math.round(Math.atan2((h-30)-a.ly,a.lx-30)*180/Math.PI),B=Math.round(Math.atan2((h-30)-a.ly,(w-30)-a.lx)*180/Math.PI);
    A=Math.min(150,Math.max(1,A));B=Math.min(150,Math.max(1,B));
    if(A+B>=180){const k=178/(A+B);A=Math.max(1,Math.floor(A*k));B=Math.max(1,Math.floor(B*k))}
    e.props.a=A;e.props.b=B;return{ok:1}}
  case 'reset':{E[a.id].props=clone(TYPES[E[a.id].type].defaults);return{ok:1}}
  case 'set':{if((s.binds||[]).some(b=>b.to===a.id&&b.k===a.k))return{ok:0,why:'这个属性由别的器材决定，先点“解除”'};
    const e=E[a.id],T=TYPES[e.type],f=T.fields.find(f=>f.k===a.k);let v=Number(a.v);
    if(!Number.isFinite(v)||!Number.isInteger(v/(f.step||1)))return{ok:0,why:'只能填整数'};
    if(v<f.min||v>f.max)return{ok:0,why:`${f.label.replace(/（.*/,'')}只能在 ${f.min} 到 ${f.max} 之间`};
    if(e.type==='numline'){const o=Object.assign({},e.props,{[a.k]:v});if(o.max-o.min<1)return{ok:0,why:'最右要比最左大'};if(o.max-o.min>20)return{ok:0,why:'数轴最长 20 格'}}
    e.props[a.k]=v;return{ok:1}}
  case 'link':{const f=E[a.from],to=E[a.to];if(!f||!to||a.from===a.to)return{ok:0,why:'连到另一个器材上'};
    const out=outKind(f,a.fromPort),acc=TYPES[to.type].accepts;
    if(!acc)return{ok:0,why:`${to.name} 不接收输入`};
    if(out!==acc&&!(out==='dist'&&TYPES[to.type].acceptsDist))return{ok:0,why:out==='fn'?'直线只能连到坐标平面上':acc==='bool'?'判断灯只接收「平衡」（是或否）':out==='bool'?`${to.name} 不接收「平衡」`:out==='dist'?`${to.name} 不接收分布（一批数），只有数据表能接`:`${to.name} 只接收直线，不接收数`};
    // 维度：天平不称面积、数轴不放面积；合并器只合并同一种东西。
    const fd=dimOf(s,a.from),rj=TYPES[to.type].reject;if(rj&&rj[fd])return{ok:0,why:rj[fd]};
    if(to.type==='adder'){const other=inputs(s,a.to).map(l=>dimOf(s,l.from)).find(x=>x!==fd);if(other)return{ok:0,why:`合并器只合并同一种东西：${dimLabel(fd)} 和 ${dimLabel(other)} 不能加`}}
    if(a.fromPort&&!(OUT_PORTS[f.type]||[]).some(p=>p.id===a.fromPort))return{ok:0,why:'这个器材没有这个输出'};
    if(s.links.some(l=>l.from===a.from&&l.to===a.to&&(l.fromPort||null)===(a.fromPort||null)))return{ok:0,why:'已经连过了'};
    if(reach(s,a.to,a.from))return{ok:0,why:'不能连成一个圈'};
    if(to.type==='balance'&&inputs(s,a.to).filter(l=>l.slot===a.slot).length>=5)return{ok:0,why:'一个盘最多放 5 个'};
    if(to.type==='numline'&&inputs(s,a.to).length>=6)return{ok:0,why:'数轴上最多 6 个点'};
    if(to.type==='div'&&inputs(s,a.to).some(l=>l.slot===a.slot))return{ok:0,why:a.slot==='L'?'左边已经有被除数了':'右边已经有除数了'};
    addLink(s,a.from,a.to,(to.type==='balance'||to.type==='div')?a.slot:null,a.fromPort);return{ok:1}}
  case 'bind':{const t=E[a.to],src=E[a.from];if(!t||!src||a.to===a.from)return{ok:0,why:'绑到另一个器材上'};

  case 'unbind':{const old=(s.binds||[]).find(b=>b.to===a.to&&b.k===a.k);s.binds=(s.binds||[]).filter(b=>!(b.to===a.to&&b.k===a.k));

  }}catch(err){return{ok:0,why:'这个数不合法'}}
  return{ok:0,why:'不认识的操作'};
}

/* ========== 引擎：只有这里算后果。纯函数 scene → derived ========== */
function qv(x){return x&&x.val?x.val.data:null}
/* 黑箱的规则库：0 线性 y = a·x + b；1 平方 y = a·x² + b；2 倒数 y = a÷x + b（x 为 0 时算不出）。 */

/* 两个钟的时间差：有名为「开始」「结束」的两个钟时，按这两个钟算（从开始到结束）；否则按放进来的先后。 */

  const E=s.entities,vals={},busy={},D={};

    if(e.type==='num'||e.type==='var')v=Q(e.props.v);else if(e.type==='frac')v=Q(e.props.n,e.props.d);

      if(e.props.op===1&&xs.length)v=xs.slice(1).reduce((t,x)=>qsub(t,x),xs[0]);else{v=Q(0);for(const x of xs)v=qadd(v,x)}}
    else if(e.type==='rect')v=Q(e.props.w*e.props.h);else if(e.type==='money')v=Q(e.props.yuan*100+e.props.jiao*10+(e.props.fen||0),100);
    else if(e.type==='mul'){const ls=inputs(s,id);v=Q(1);let any=false;for(const l of ls){const x=vf(l);if(x){v=Q(v.n*x.n,v.d*x.d);any=true}}
      // 没连任何输入：空乘积是 1。连了线但都没有值：还没有结果。有值：再乘 times（保留分母）。
      if(!ls.length)v=Q(1);else if(!any)v=null;else v=Q(v.n*(e.props.times||1),v.d)}
    else if(e.type==='balance'&&port==='equal'){const Ls=inputs(s,id).filter(l=>l.slot==='L'),Rs=inputs(s,id).filter(l=>l.slot==='R');const tot=ls=>ls.reduce((t,l)=>{const x=vf(l);return x?qadd(t,x):t},Q(0));if(Ls.length&&Rs.length)v={kind:'bool',data:qeq(tot(Ls),tot(Rs))}}
    else if(e.type==='box'){const l=inputs(s,id)[0];const x=l&&vf(l);v=x?boxOut(e.props,x):null}
    else if(e.type==='dice'){const c=e.props.counts;if(port==='dist'&&c){v={kind:'dist',data:c.slice()}}else if(c&&c.some(x=>x>0)){if(port==='tot')v=Q(c.reduce((x,y)=>x+y,0));else if(port==='best'){let bi=2;for(let i=2;i<=12;i++)if(c[i]>c[bi])bi=i;v=Q(bi)}}}

  // 数据表：连进来的数依次填进 a、b、c、d（连线的先后），没连线的格子保留自己的数。合计、平均、最大都从这四个格子算。

    if(dl){const c=val(dl.from,dl.fromPort).data;let tot=0,nd=0,bi=2;for(let i=0;i<c.length;i++){tot+=c[i]||0;if((c[i]||0)>0)nd++}for(let i=2;i<=12;i++)if((c[i]||0)>(c[bi]||0))bi=i;slots=[Q(tot),Q(bi),Q(c[bi]||0),Q(nd)]}

function portsFor(e,s,E,D){const p=e.props,P={};

  switch(e.type){
  case 'dice':P.dist=p.counts?{kind:'dist',counts:p.counts.slice()}:null;break;
  case 'clock':{const cl=clockPair(E);if(cl&&cl[0].id===e.id){const t=c=>((c.props.h%12)*60+c.props.m);P.between=((t(cl[1])-t(cl[0]))%720+720)%720}break}
  case 'bars':{const mx=Math.max(p.a,p.b,p.c);P.bMinusA=p.b-p.a;P.max=mx;P.topNames=['一班','二班','三班'].filter((_,i)=>[p.a,p.b,p.c][i]===mx).join('、');break}

  case 'ineq':P.set={op:p.op,b:p.b};break;
  case 'hyper':P.y2=p.k/2;break;
  case 'parab':if(p.a!==0){P.vx=-p.b/(2*p.a);P.vy=p.c-p.b*p.b/(4*p.a);const D0=p.b*p.b-4*p.a*p.c;P.xHits=D0>0?2:D0===0?1:0}break;

  case 'data':{const v=[p.a,p.b,p.c].sort((x,y)=>x-y),mean=(v[0]+v[1]+v[2])/3;P.mean=mean;P.mean2=Number(mean.toFixed(2));P.median=v[1];break}

  case 'congr':{const x=[3,4,5],y=[p.a,p.b,p.c];P.congruent=[...x].sort().join()===[...y].sort().join();break}
  case 'fact':{let f=null;for(let a=-10;a<=10&&!f;a++)for(let b=a;b<=10&&!f;b++)if(a+b===p.b&&a*b===p.c)f=[a,b];P.factors=f;break}
  case 'rect':P.area=p.w*p.h;P.peri=2*(p.w+p.h);P.square=p.w===p.h;break;
  case 'tangent':P.relation=p.d>p.r?'apart':p.d===p.r?'tangent':'cross';break;
  case 'dice':P.tot=p.counts?p.counts.reduce((a,b)=>a+b,0):0;break;
  case 'angle':P.deg=p.deg;break;
  case 'table':{const T=D[e.id].tab;P.sum=T.sum;P.mean=T.mean;P.max=T.max;break}
  case 'afrac':if(p.d!==0)P.value=p.n/p.d;break;
  case 'radical':{const n=p.n;let kk=1,mm=n;for(let k=Math.floor(Math.sqrt(n));k>=2;k--){if(n%(k*k)===0){kk=k;mm=n/(k*k);break}}P.kk=kk;P.mm=mm;break}

/* ========== 浮动工具条 + 属性卡（点物体 → 旁边出设置卡） ========== */
function placeFloat(){const tl=$('tools'),cd=$('card');const e=sel&&S.entities[sel];
  if(!e&&!selLink){tl.style.display=cd.style.display='none';return}
  if(selLink&&!e){tl.style.display='none';cd.style.display='none';return}
  const [w]=size(e),sx=view.x+(e.x+w)*view.z,sy=view.y+e.y*view.z,W=$('stageWrap').clientWidth,H=$('stageWrap').clientHeight;
  const T=TYPES[e.type];tl.innerHTML=`<button data-tool="card" title="设置">⚙</button><button data-tool="dup" title="复制">📋</button>${T.rotate?'<button data-tool="rotate" title="转 15°（卡里可以调到任意度数）">🔄</button>':''}<button data-tool="del" title="删除">🗑</button>`;
  tl.style.display='flex';tl.style.left=Math.min(W-44,sx+12)+'px';tl.style.top=Math.max(8,sy)+'px';
  if(!cardOpen){cd.style.display='none';return}
  // 设置卡停靠在台面右上角，不跟着器材跑，不盖住台面上的东西。
  cd.style.left=Math.max(8,W-262)+'px';cd.style.top='12px';cd.style.maxHeight=Math.max(200,H-24)+'px';cd.style.overflowY='auto';cd.style.display='block';
  if(cd.dataset.for!==e.id||cd.dataset.v!==JSON.stringify(e.props)+e.name)buildCard(e);
}
function stateLine(e){const d=D[e.id]||{};if(qv(d)&&e.type!=='rect'&&e.type!=='clock')return qs(qv(d));if(e.type==='fn')return'y = '+fx(e.props.k,e.props.b);if(e.type==='rect')return`${e.props.w} × ${e.props.h} = ${e.props.w*e.props.h}`;
  if(e.type==='balance')return`${d.L?qs(d.L):0} : ${d.R?qs(d.R):0}`;if(e.type==='numline')return`${e.props.min} 到 ${e.props.max}`;if(e.type==='dice')return`${d.tot||0} 回`;return TYPES[e.type].label}
/* 卡内只读推导值。圆的 π 与台面信号一致（默认 3.14）。 */
function derivedLines(e){const p=e.props;const n=x=>String(+x.toFixed(2));
  if(e.type==='circle'){const r=p.r;return[`周长 ${n(2*3.14*r)} 厘米，面积 ${n(3.14*r*r)} 平方厘米`]}
  if(e.type==='tri'){const c=180-p.a-p.b;return[c>0?`第三个角是 ${c}°`:`两个角已经 ${p.a+p.b}°，超过 180°，画不出三角形`]}
  return[]}
function buildCard(e){const cd=$('card'),T=viewType(e);cd.dataset.for=e.id;cd.dataset.v=JSON.stringify(e.props)+e.name;
  let h=`<h4>${T.label} · 设置</h4><input class="name" data-name value="${esc(e.name)}"><div class="state">${esc(stateLine(e))}</div>`;
  for(const f of T.fields){const v=e.props[f.k];const bd=(S.binds||[]).find(x=>x.to===e.id&&x.k===f.k);if(bd){h+=`<div class="fld"><label><span>${f.label}</span><b>${bd.expr?'ƒ '+esc(bd.expr):'← '+esc((S.entities[bd.from]||{name:'（已删）'}).name)}</b></label><div class="ctl"><span class="muted">由它决定：${v}</span><button class="btn" data-unbind="${f.k}">解除绑定</button></div></div>`;continue}if(f.choices){h+=`<div class="fld"><label><span>${f.label}</span></label><div class="ctl seg-choice">${f.choices.map((c,i)=>`<button class="pm${v===i?' on':''}" data-pick="${f.k}" data-pv="${i}">${c}</button>`).join('')}</div></div>`;continue}h+=`<div class="fld"><label><span>${f.label}</span></label><div class="ctl"><button class="pm" data-pm="${f.k}" data-dv="-${f.step||1}">−</button><input type="range" data-f="${f.k}" min="${f.min}" max="${f.max}" step="${f.step||1}" value="${v}"><button class="pm" data-pm="${f.k}" data-dv="${f.step||1}">+</button><input type="number" data-fn="${f.k}" value="${v}"></div></div>`}
  for(const f of T.fields){if(!(S.binds||[]).some(x=>x.to===e.id&&x.k===f.k))h+=`<button class="btn" data-bindpick="${f.k}">🔗 把「${esc(f.label.replace(/（.*/,''))}」绑到一个数</button>`}
  for(const f of T.fields){if(f.choices||(S.binds||[]).some(x=>x.to===e.id&&x.k===f.k))continue;h+=`<button class="btn" data-exprpick="${f.k}">ƒx 写表达式</button>`;

function p3Build(p){return function(s){
  if(p.kind==='clock'){addEnt(s,'clock',240,40,{h:1,m:0});return}
  if(p.kind==='clock2'){const c1=addEnt(s,'clock',200,40,{h:1,m:0});s.entities[c1].name='开始';const c2=addEnt(s,'clock',420,40,{h:1,m:0});s.entities[c2].name='结束';return}
  if(p.money){p.money.forEach((q,i)=>addEnt(s,'money',60,60+i*110,{yuan:q[0],jiao:q[1]}));addEnt(s,'adder',330,110);return}
  p.nums.forEach((v,i)=>addEnt(s,'num',60+(i%2)*0,60+i*110,{v}));
  if(p.kind==='sum')addEnt(s,'adder',330,110);
  else addEnt(s,'numline',120,340,{min:0,max:Math.max(...p.nums)+2});
}}
function p3Steps(p){
  if(p.kind==='clock')return[
    {label:'把时针指到 '+p.a+' 点',score:1,hint:'点钟面卡，在属性卡里把“时”调到 '+p.a,target:s=>byType(s,'clock'),check:s=>{const c=byType(s,'clock');return !!c&&s.entities[c].props.h===p.a}},
    {label:'分针指到 12，是整时',score:2,hint:'把“分”调到 0',target:s=>byType(s,'clock'),check:s=>{const c=byType(s,'clock');return !!c&&s.entities[c].props.h===p.a&&s.entities[c].props.m===0}}];
  if(p.kind==='clock2'){const ck=(s,name)=>Object.values(s.entities).find(e=>e.type==='clock'&&e.name===name);
    return[
      {label:'第一个钟拨到开始的时刻',score:1,hint:'开始的钟：时 '+p.start[0]+'，分 '+p.start[1],target:s=>byType(s,'clock'),check:s=>{const c=ck(s,'开始');return !!c&&c.props.h===p.start[0]&&c.props.m===p.start[1]}},
      {label:'第二个钟拨到结束的时刻',score:1,hint:'结束的钟：时 '+p.end[0]+'，分 '+p.end[1],target:s=>byType(s,'clock'),check:s=>{const c=ck(s,'结束');return !!c&&c.props.h===p.end[0]&&c.props.m===p.end[1]}},
      {label:'看两个钟相差多少分钟',score:2,hint:'看钟面下面的“相差”',target:s=>byType(s,'clock'),check:(s,D)=>{const a=ck(s,'开始'),b=ck(s,'结束'),c=Object.values(s.entities).filter(e=>e.type==='clock');return c.length===2&&!!a&&!!b&&D[a.id].ports.between===p.ans}}];}
  const cnt=p3Count(p);
  if(p.kind==='sum')return[
    {label:'把数都连到合并器',score:1,hint:'拖数的蓝点到合并器',target:s=>byType(s,'adder'),check:(s,D)=>{const ad=byType(s,'adder');return !!ad&&inputs(s,ad).length>=cnt}},
    {label:'合并器算出的和就是答案',score:2,hint:'看合并器的读数',target:s=>byType(s,'adder'),check:(s,D)=>{const ad=byType(s,'adder');return !!ad&&!!qv(D[ad])&&qeq(qv(D[ad]),p.money?Q(p.ans,10):Q(p.ans))}}];
  return[
    {label:'把两个数都连到数轴',score:1,hint:'拖两个数的蓝点到数轴',target:s=>byType(s,'numline'),check:(s,D)=>{const nl=byType(s,'numline');return !!nl&&inputs(s,nl).length>=2}},
    {label:'数轴上两点的距离就是答案',score:2,hint:'看数轴下面的“相差”',target:s=>byType(s,'numline'),check:(s,D)=>{const nl=byType(s,'numline');if(!nl)return false;const vs=inputs(s,nl).map(l=>D[l.from]&&qv(D[l.from])).filter(Boolean);return vs.length>=2&&Math.abs(qnum(vs[0])-qnum(vs[1]))===p.ans}}];
}
P3.forEach(p=>XP.push({id:p.id,title:p.title,domain:p.domain,grade:p.grade,tools:p.tools,q:p.q,why:p.why,build:p3Build(p),steps:p3Steps(p)}));

  val:(s,D,t,v)=>{const e=byType(s,t);return !!e&&!!qv(D[e])&&qeq(qv(D[e]),v)},
  slot:(s,D,t,sl,v)=>{const e=byType(s,t);return !!e&&inputs(s,e).some(l=>l.slot===sl&&!!qv(D[l.from])&&qeq(qv(D[l.from]),v))},
  from:(s,a,b)=>{const x=byType(s,a),y=byType(s,b);return !!x&&!!y&&s.links.some(l=>l.from===x&&l.to===y)},
};

function startXp(id,m){xp=XP.find(x=>x.id===id);if(!xp)return;mode=m;S=blankScene();xp.build(S);undoSt=[];redoSt=[];sel=null;cardOpen=false;
  run={steps:xp.steps.map((s,i)=>({i,done:false})),ops:0,errors:0,t0:Date.now(),finished:false};
  if(m==='practice'){try{const sv=JSON.parse(localStorage.getItem(PR)||'null');if(sv&&sv.id===id&&sv.S){S=sv.S;run.ops=sv.ops||0;(sv.steps||[]).forEach((d,i)=>{if(run.steps[i])run.steps[i].done=!!d});toast('接着上次做：已完成的步骤保留')}}catch(e){localStorage.removeItem(PR)}}
  $('title').textContent=xp.title;
  D=evaluate(S);setModeUi();showTab('steps');fit();if(m==='exam')startTimer();toast(m==='exam'?'考试开始：没有提示，10 分钟':'练习：跟着左边的步骤做，下一步要动的器材会发光')}
function setModeUi(){document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  $('timer').style.display=$('submit').style.display=mode==='exam'?'inline-block':'none';$('menuBtn').style.display=mode==='practice'?'inline-block':'none';
  $('whyBtn').style.display=mode==='exam'?'none':'inline-block';stopTimerIf()}
function stopTimerIf(){if(mode!=='exam'&&timerId){clearInterval(timerId);timerId=null}}
function startTimer(){clearInterval(timerId);const end=Date.now()+600000;const tick=()=>{const ms=Math.max(0,end-Date.now());$('timer').textContent=`⏱ ${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`;if(!ms){clearInterval(timerId);timerId=null;submitExam(true)}};tick();timerId=setInterval(tick,500)}
function goFree(){mode='free';xp=null;run=null;sel=null;cardOpen=false;try{S=JSON.parse(localStorage.getItem(LS.free))||blankScene()}catch(e){S=blankScene()}undoSt=[];redoSt=[];$('title').textContent='我的实验';setModeUi();showTab('lib');afterChange()}
$('modeSeg').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const m=b.dataset.mode;
  if(m==='free'){if(mode==='exam'&&!confirm('退出考试？这次不计分。'))return;goFree();return}
  const id=xp?xp.id:(openXp||null);if(!id){$('left').classList.remove('closed');showTab('lib');toast('先在实验库里选一个实验');return}
  if(mode==='exam'&&m!=='exam'&&!confirm('退出考试？这次不计分。'))return;startXp(id,m)};
$('menuBtn').onclick=()=>modal(`<h3>练习菜单</h3><div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-m="re">重置练习</button><button class="btn" data-m="exit">退出练习</button><button class="btn pri" data-m="exam">进入考试</button></div>`);
$('submit').onclick=()=>submitExam(false);
// 预测步骤：猜对才得分；猜错只是这一步不得分，不扣别的步。
function score(){return xp.steps.reduce((a,s,i)=>a+(run.steps[i].done&&(s.type!=='predict'||run.steps[i].pred===s.expect)?s.score:0),0)}
$('paneSteps').addEventListener('click',ev=>{const b=ev.target.closest('[data-predict]');if(!b||!run||!xp)return;const i=+b.dataset.predict;const inp=$('paneSteps').querySelector(`[data-predict-input="${i}"]`);if(!inp||inp.value.trim()==='')return;run.steps[i].pred=Number(inp.value);track();renderSteps();render()});
function practiceDone(){modal(`<h3>练习完成 🎉</h3><p>${xp.steps.length} 步全部做对，用了 ${run.ops} 次操作${run.errors?`，有 ${run.errors} 次被台面拒绝`:''}。</p><div class="q"><b>为什么</b><div>${esc(xp.why)}</div></div><div style="display:flex;gap:8px"><button class="btn" data-m="re">再练一次</button><button class="btn pri" data-m="exam">进入考试</button><button class="btn" data-m="lib">返回实验库</button></div>`)}
function submitExam(auto){if(mode!=='exam'||!run)return;clearInterval(timerId);timerId=null;const tot=xp.steps.reduce((a,s)=>a+s.score,0),sc=score();const used=Math.round((Date.now()-run.t0)/1000);
  const H=hist(),h=H[xp.id]||{n:0,lost:{}};h.n++;h.last=`${sc}/${tot}`;xp.steps.forEach((s,i)=>{if(!run.steps[i].done)h.lost[s.label]=(h.lost[s.label]||0)+1});const w=Object.entries(h.lost).sort((a,b)=>b[1]-a[1])[0];h.worst=w?w[0]:'';H[xp.id]=h;localStorage.setItem(LS.hist,JSON.stringify(H));
  // 把考试结果交给主应用（跨次统计）：主页面收到 labNbExam 消息后记入 math-lab-proc-v1。
  try{window.parent&&window.parent!==window&&window.parent.postMessage({type:'labNbExam',payload:{labId:xp.id,title:xp.title,score:sc,max:tot,opCount:run.ops,lines:xp.steps.map((s,i)=>({id:s.label,got:!!run.steps[i].done}))}},'*')}catch(e){}
  const lost=xp.steps.filter((s,i)=>!run.steps[i].done);
  modal(`<h3>${auto?'时间到，':''}考试报告</h3><div class="score">${sc}<span class="muted" style="font-size:18px"> / ${tot}</span></div><div class="muted">用时 ${Math.floor(used/60)} 分 ${used%60} 秒 · 操作 ${run.ops} 次 · 被拒绝 ${run.errors} 次</div>
   <ul class="rep">${xp.steps.map((s,i)=>`<li class="${run.steps[i].done?'':'lost'}"><span>${run.steps[i].done?'✓':'×'} ${esc(s.label)}</span><span>${run.steps[i].done?s.score:0}/${s.score}</span></li>`).join('')}</ul>
   ${lost.length?`<div class="q">丢分在：${lost.map(s=>esc(s.label)).join('；')}。去练习模式把这几步再做一遍。</div>`:'<div class="q">满分！</div>'}
   <div style="display:flex;gap:8px"><button class="btn pri" data-m="exam">再考一次</button><button class="btn" data-m="practice">回练习</button><button class="btn" data-m="lib">返回实验库</button></div>`);
  run.finished=true}
function modal(h){$('modalBox').innerHTML=h;$('modal').style.display='grid'}
$('modal').onclick=ev=>{const b=ev.target.closest('[data-m]');if(ev.target===$('modal')){$('modal').style.display='none';return}if(!b)return;const m=b.dataset.m,id=xp&&xp.id;$('modal').style.display='none';
  if(m==='re')startXp(id,'practice');else if(m==='exam')startXp(id,'exam');else if(m==='practice')startXp(id,'practice');else if(m==='exit'||m==='lib')goFree();else if(m==='savefind'){const t=$('findTx').value.trim();if(t){const a=JSON.parse(localStorage.getItem(LS.find)||'[]');a.unshift({t,at:new Date().toLocaleString(),xp:xp?xp.title:'自由探究'});localStorage.setItem(LS.find,JSON.stringify(a.slice(0,50)));postToParent({type:'labNbDiscovery',payload:{text:t,labId:xp?xp.id:null,title:xp?xp.title:'自由探究'}});toast('记下了')}}};
$('whyBtn').onclick=()=>{if(!xp){modal('<h3>为什么</h3><p>自由探究没有标准答案。台面上的每个结果都是按数学规律算出来的——试着改一个数，猜猜会发生什么，再看看猜对没有。</p>');return}
  if(mode==='practice'&&!run.finished){modal(`<h3>为什么</h3><p>先自己做完再看——发现之后再讲，记得更牢。</p>`);return}modal(`<h3>为什么</h3><p>${esc(xp.why)}</p>`)};
$('findBtn').onclick=()=>{const a=JSON.parse(localStorage.getItem(LS.find)||'[]');modal(`<h3>我的发现</h3><textarea id="findTx" placeholder="我发现……"></textarea><div style="display:flex;gap:8px;margin:8px 0"><button class="btn pri" data-m="savefind">记下来</button></div>${a.slice(0,5).map(f=>`<div class="muted" style="font-size:12px;margin-top:6px">${esc(f.at)} · ${esc(f.xp)}<br><span style="color:var(--tx)">${esc(f.t)}</span></div>`).join('')}`)};

let toastT;function toast(t,err){const el=$('toast');el.textContent=t;el.className=err?'err':'';el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',2600)}
window.addEventListener('resize',render);
renderLib();renderXpList();goFree();
// 知识点页发来 openXp：直接进入对应实验（练习模式，有提示）。
// 握手：实验台加载好后先告诉父页面；父页面每收到 openXp 都回一个 openXpAck。父页面没收到回执会重发，
// 所以同一个实验 3 秒内只开一次，免得把做了一半的台面又重置。
function postToParent(m){try{if(window.parent&&window.parent!==window)window.parent.postMessage(m,'*')}catch(err){}}
let lastOpenXp={id:null,t:0};
window.addEventListener('message',e=>{if(e.source!==window.parent)return;const d=e.data;if(!d)return;
  if(d.type!=='openXp')return;
  const xp=XP.find(x=>x.id===d.id);
  if(!xp){postToParent({type:'openXpAck',id:d.id,ok:false,why:'实验台里没有这个实验'});return}
  const now=Date.now();
  if(!(lastOpenXp.id===xp.id&&now-lastOpenXp.t<3000))startXp(xp.id,'practice');
  lastOpenXp={id:xp.id,t:now};
  postToParent({type:'openXpAck',id:xp.id,ok:true});
});
postToParent({type:'labNbReady'});
window.__lab={get S(){return S},act,evaluate,commit,startXp,XP,get run(){return run},submitExam,goFree};
</script>
